name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Совпадает с docker-compose.yml, но внутри CI сервисы доступны на стандартных портах.
  DATABASE_URL: postgresql://aisdos:aisdos@localhost:5432/aisdos
  REDIS_URL: redis://localhost:6379
  ADAPTERS_MODE: mock
  BETTER_AUTH_SECRET: ci-secret-not-used-outside-ci
  BETTER_AUTH_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aisdos
          POSTGRES_PASSWORD: aisdos
          POSTGRES_DB: aisdos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aisdos -d aisdos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из "packageManager" в package.json. Указывать её
      # ещё и здесь нельзя: action падает на двух источниках правды, и они
      # разъедутся при первом же обновлении pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Check database connection
        run: pnpm db:check

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aisdos
          POSTGRES_PASSWORD: aisdos
          POSTGRES_DB: aisdos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aisdos -d aisdos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из "packageManager" в package.json. Указывать её
      # ещё и здесь нельзя: action падает на двух источниках правды, и они
      # разъедутся при первом же обновлении pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  # Готовые образы для боевой машины.
  #
  # Раньше сервер собирал приложение сам на каждой выкладке — семь минут, и
  # всё это время старый процесс уже остановлен. Теперь сборка здесь, а
  # сервер только скачивает результат: выкладка занимает полминуты.
  #
  # Только для main и только после проверок. Образ помечен хэшем коммита, и
  # сервер просит ровно тот, что у него в checkout: коммит, не прошедший
  # проверки, образа не получает, и выложить его нельзя — скачивание упадёт.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Реестр требует строчных букв, а владелец репозитория — с заглавными.
      REGISTRY: ghcr.io/dev-in-crypt

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/answertally-web:${{ github.sha }}
          # NEXT_PUBLIC_* попадают в бандл на сборке, поэтому живут здесь, в
          # переменных репозитория, а не на сервере. На сервере они тоже
          # есть — для рантайма; разойдутся — ссылки в письмах поведут не
          # туда, куда ведёт сайт. Менять оба места вместе.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_REPORT_HOST=${{ vars.NEXT_PUBLIC_REPORT_HOST }}
            NEXT_PUBLIC_SALES_EMAIL=${{ vars.NEXT_PUBLIC_SALES_EMAIL }}
            NEXT_PUBLIC_SALES_URL=${{ vars.NEXT_PUBLIC_SALES_URL }}
            NEXT_PUBLIC_SALES_LABEL=${{ vars.NEXT_PUBLIC_SALES_LABEL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/answertally-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
